<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>11.1 Flashback Friday</title>
<style>
:root{--g:#B8860B;--d:#7A5A06;--l:#FFF4CC;--ink:#2b2b2b;--ok:#2e7d32;--bad:#c62828;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#fff;color:var(--ink);font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;display:flex;flex-direction:column}
.top{height:6px;background:var(--l)}#pf{height:100%;width:0;background:var(--g);transition:.3s}
.wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
.stage{width:min(100%,calc((100vh - 140px)*16/9));aspect-ratio:16/9;border:3px solid var(--g);border-radius:12px;background:#fff;container-type:size;overflow:hidden}
.s{font-size:1.65cqw;height:100%;padding:2.2cqw 3.5cqw;overflow:auto;line-height:1.4}
.tag{display:inline-block;background:var(--g);color:#fff;border-radius:2em;padding:.15em .9em;font-size:.75em;font-weight:700}
h2{color:var(--d);font-size:1.7em;margin:.3em 0}h3{color:var(--d);margin:.3em 0}
.cols{display:flex;gap:2cqw}.cols>*{flex:1}
.box{background:var(--l);border-left:.4em solid var(--g);border-radius:.5em;padding:.5em .9em;margin:.5em 0}
select,select option{color:#000!important}select option{background:#fff}
select{font:inherit;border:2px solid var(--g);border-radius:.4em;padding:.05em .2em;background:#fff;max-width:12em}
input{font:inherit;font-size:1.2em;border:3px solid var(--g);border-radius:.5em;padding:.4em .7em;width:60%}
.chip{display:inline-block;padding:0 .2em;margin:.05em;border-radius:.4em;border:1.5px dashed transparent;cursor:pointer}.chip:hover{background:var(--l)}.chip.on{background:#ffe08a;border-color:var(--g)}
.tp{display:inline-block;border:2px solid var(--g);border-radius:2em;padding:.25em .9em;margin:.3em .2em;font-size:1.05em;line-height:1.3;white-space:nowrap}
.ok{outline:3px solid var(--ok);background:#e8f5e9!important}.bad{outline:3px solid var(--bad);background:#ffebee!important}
.bub{max-width:78%;padding:.5em .9em;border-radius:1.1em;margin:.4em 0;background:var(--l);border:1px solid var(--g)}.bub.r{margin-left:auto;background:var(--g);color:#fff}.bub small{display:block;font-weight:700;opacity:.85}
.bub.r .chip.on,.bub.r .ok,.bub.r .bad{color:var(--ink)}.fix{display:none;color:var(--ok);font-size:.85em}.shown .fix{display:block}
.post{border:2px solid #e6d9a8;border-radius:.6em;padding:.5em .8em;font-size:.82em;margin-bottom:.5em}.post p{margin:.3em 0}.adj{background:var(--l);padding:0 .15em;border-radius:.3em}
table{border-collapse:collapse;width:100%}td,th{border:2px solid var(--g);padding:.3em .6em}th{background:var(--l)}
.ctrl{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;padding:4px 8px 10px}
button{font:inherit;font-size:14px;border:2px solid var(--g);background:#fff;color:var(--d);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600}button.p{background:var(--g);color:#fff}button:disabled{opacity:.35;cursor:default}
.s button{font-size:1em}
#sc{font-weight:700;color:var(--d);min-width:7em;text-align:center}
.notes{position:fixed;left:8px;right:8px;bottom:56px;max-height:45vh;overflow:auto;background:#fff;border:3px solid var(--g);border-radius:10px;padding:10px 16px;font-size:14px;display:none;z-index:5}.notes.on{display:block}
.big{font-size:4.5em;text-align:center;line-height:1.1}.mid{text-align:center}
.cert{border:.6em double var(--g);padding:1.5em;text-align:center;height:100%}.cert h1{color:var(--d);font-size:2.4em;margin:.1em}.cert .nm{font-size:2.6em;color:var(--g);border-bottom:2px solid var(--g);display:inline-block;padding:0 1em}
@media print{.ctrl,.top,.notes{display:none!important}.stage{width:100%;border:0}}
</style></head><body>
<div class="top"><div id="pf"></div></div>
<div class="wrap"><div class="stage" id="st"></div></div>

add('1 Language in context',`<h2>1 · Language in context</h2><div class="box" style="margin-top:0"><b>A</b> Read their posts and comments. Circle the topics he writes about.</div><div class="cols"><div class="post"><p><b>Mason Clark</b> It’s Flashback Friday! Here are two of my favorite memories from 2009. I was eight. This was in the summer. I was with my sister, and we were on vacation at my grandparents’ house. My parents weren’t there. It was exciting! #flashbackfriday #2009 #summervacation</p><p><b>Fay L. Wright</b> You were really cute!</p><p><b>Bert Chow</b> Your grandparents’ yard was beautiful!</p><p><b>Mason Clark</b> Yeah, it was wonderful! It was usually quiet, but not in the summer. We were noisy kids!</p></div><div class="post"><p><b>Mason Clark</b> And this was my old go-kart. My grandpa made it for me. Well, it wasn’t old in 2009 – it was new then! It was slow, but to me, at eight, it was really fast and exciting. #go-kart #2009 #bestgrandparents</p><p><b>Sam Lopez</b> My go-kart was awful, but yours is great.</p><p><b>Bethany Clark</b> Hey, Mason is still driving it today! 😂</p><p><b>Mason Clark</b> Don’t listen to my sister! I have a real, fast car now. 🙂</p></div></div><p style="margin:.2em 0"><b>Mason writes about…</b> ${[['his school',0],['the season',1],['his family',1],['his first job',0],['a toy',1],['his favorite food',0]].map(x=>`<span class="tp chip" data-a="${x[1]}" onclick="this.classList.toggle('on')">${x[0]}</span>`).join('')}</p>`
);

add('2 Vocabulary',()=>`<h2>2 · Vocabulary: Describing people, places, and things</h2><p style="font-size:1.2em">2A · Listen and repeat the adjectives in <b>bold</b>.</p><div class="mid">${[['new','shoes'],['cute','dog'],['wonderful','vacation'],['noisy','baby'],['fast','car'],['exciting','book'],['beautiful','day'],['awful','day'],['quiet','baby'],['slow','car']].map(x=>`<span class="tp"><b>${x[0]}</b> ${x[1]}</span>`).join('')}</div><p class="mid"><b>🎧 Audio 2.43</b></p><p class="mid"><audio id="au" controls src="${AUDIO}" style="width:60%"></audio></p>`
);

[['👟','new','new shoes','new /njuː/ (one syllable)','Are the shoes old? (No) Did she buy them recently? (Yes). Opposite: old.'],
['🐶','cute','cute dog','cute /kjuːt/ (one syllable)','Is the dog nice to look at? (Yes) Is it scary? (No). Cute is for people, animals, babies.'],
['🏞️','wonderful','wonderful vacation','WON-der-ful /ˈwʌndərfəl/ (3 syllables, stress on 1)','Is it a very good vacation? (Yes, very good) Is it a bad one? (No).'],
['👶','noisy','noisy baby','NOI-sy /ˈnɔɪzi/ (2 syllables, stress on 1)','Is the baby quiet? (No) Can you hear the baby from far away? (Yes). Opposite: quiet.'],
['🏎️','fast','fast car','fast /fæst/ (one syllable)','Does the car go quickly? (Yes) Opposite: slow.'],
['📖','exciting','exciting book','ex-CI-ting /ɪkˈsaɪtɪŋ/ (3 syllables, stress on 2)','Is the book boring? (No) Do you want to keep reading? (Yes). Do not confuse exciting (the book) with excited (the person).'],
['🌅','beautiful','beautiful day','BEAU-ti-ful /ˈbjuːtɪfəl/ (3 syllables, stress on 1)','Is the day nice to look at / pleasant? (Yes) Is it ugly? (No).'],
['⛈️','awful','awful day','AW-ful /ˈɔːfəl/ (2 syllables, stress on 1)','Is it a good day? (No) Is it a very bad day? (Yes). Opposite of wonderful.'],
['😴','quiet','quiet baby','QUI-et /ˈkwaɪət/ (2 syllables, stress on 1)','Can you hear the baby? (No / not much) Opposite: noisy.'],
['🐢','slow','slow car','slow /sləʊ/ (one syllable)','Does the car go quickly? (No) Opposite: fast.']].forEach(v=>{
const w=v[2].split(' ');add('Vocabulary · '+v[1],`<div class="mid"><div class="big">${v[0]}</div><h2 style="font-size:3.4em;margin:.1em;color:var(--g)">${w[0]}</h2><p><button class="p" style="font-size:1.2em" onclick="say('${w[0]}')">🔊 Listen and repeat</button> <button style="font-size:1.2em" onclick="this.style.display='none';document.getElementById('nn').style.display='block'">Show noun</button></p><div id="nn" style="display:none"><h2 style="font-size:2.4em;margin:.1em"><b style="color:var(--g)">${w[0]}</b> ${w[1]}</h2><button onclick="say('${v[2]}')">🔊 Listen to the phrase</button></div></div>`
)});

add('2A Noticing',`<h2>Noticing: adjectives in the text</h2><p style="margin:.2em 0">The adjectives are in <b>bold</b>. Which adjectives describe people, places, and things? Choose, then check.</p><div class="cols" style="grid-template-columns:1.5fr 1fr"><div class="post" style="font-size:.95em;flex:1.5"><p><b>Mason Clark</b> It’s Flashback Friday! Here are two of my favorite memories from 2009. I was eight. This was in the summer. I was with my sister, and we were on vacation at my grandparents’ house. My parents weren’t there. It was <b class="adj">exciting</b>! #flashbackfriday #2009 #summervacation</p><p><b>Fay L. Wright</b> You were really <b class="adj">cute</b>!</p><p><b>Bert Chow</b> Your grandparents’ yard was <b class="adj">beautiful</b>!</p><p><b>Mason Clark</b> Yeah, it was <b class="adj">wonderful</b>. It was usually <b class="adj">quiet</b>, but not in the summer. We were <b class="adj">noisy</b> kids!</p><p><b>Mason Clark</b> And this was my old go-kart. My grandpa made it for me. Well, it wasn’t old in 2009 – it was <b class="adj">new</b> then! It was <b class="adj">slow</b>, but to me, at eight, it was really <b class="adj">fast</b> and exciting. #go-kart #2009 #bestgrandparents</p><p><b>Sam Lopez</b> My go-kart was <b class="adj">awful</b>, but yours is great.</p><p><b>Bethany Clark</b> Hey, Mason is still driving it today! 😂</p><p><b>Mason Clark</b> Don’t listen to my sister! I have a real, <i>fast</i> car now. 🙂</p></div><div style="flex:1"><p style="margin:.1em 0"><b>What does it describe?</b></p>${[['cute','people'],['noisy','people'],['beautiful','places'],['wonderful','places'],['quiet','places'],['exciting','things'],['new','things'],['slow','things'],['fast','things'],['awful','things']].map(x=>`<p style="margin:.25em 0"><b class="adj">${x[0]}</b> ${sel(['people','places','things'],x[1])}</p>`).join('')}</div></div>`
);
add('2B Match',`<h2>2B · Vocabulary 11.1 · A Match</h2><p>Match the sentences with the correct responses.</p><div class="cols"><div>${['This new restaurant isn’t good.','Your daughter is quiet.','This is a beautiful picture.','I love beach parties.','The train was very slow today.','These children are really noisy.'].map((t,k)=>`<p>${k+1} ${t} ${sel('abcdef'.split(''),'edafbc'[k])}</p>`).join('')}</div><div><p>a Thanks. I think the artist is wonderful.</p><p>b Really? It’s usually fast.</p><p>c Yes, but they’re really cute.</p><p>d That’s true. She’s really shy.</p><p>e I know. The food is awful.</p><p>f Me, too. They’re exciting, and the ocean is beautiful.</p></div></div>`
);

function render(){const s=S[i];vis.add(i);const h=typeof s.html==='function'?s.html():s.html;st.innerHTML=`<div class="s" id="cur"><span class="tag">${s.tag}</span>${h}</div>`;ex.style.display=cur.querySelector('[data-a]')?'flex':'none';sc.textContent='';ct.textContent=(i+1)+' / '+S.length;pf.style.width=((i+1)/S.length*100)+'%';pv.disabled=i==0;nx.disabled=i==S.length-1}
function go(n){if(n<0||n>=S.length)return;if(i==0&&n>0&&!name){start();return}i=n;render()}
function start(){const v=document.getElementById('nm');if(v)name=v.value.trim();if(!name){er.textContent='Please type your name first.';return}i=1;render()}
const els=()=>[...cur.querySelectorAll('[data-a]')],isS=e=>e.tagName=='SELECT';
function chk(){let t=0,c=0;els().forEach(e=>{e.classList.remove('ok','bad');if(isS(e)){t++;if(e.value===e.dataset.a){c++;e.classList.add('ok')}else e.classList.add('bad')}else{const on=e.classList.contains('on'),a=e.dataset.a=='1';if(a)t++;if(on&&a){c++;e.classList.add('ok')}else if(on!=a)e.classList.add('bad')}});sc.textContent=c+' / '+t+' correct'+(c==t?' 🎉':'')}
function shw(){if(!cur.classList.contains('shown')){els().forEach(e=>e.dataset.u=isS(e)?e.value:e.classList.contains('on')?1:0);cur.classList.add('shown')}els().forEach(e=>{e.classList.remove('bad','ok');if(isS(e)){e.value=e.dataset.a;e.classList.add('ok')}else{e.classList.toggle('on',e.dataset.a=='1');if(e.dataset.a=='1')e.classList.add('ok')}});sc.textContent='Answers shown'}
function hid(){if(!cur.classList.contains('shown'))return;els().forEach(e=>{e.classList.remove('ok','bad');if(isS(e))e.value=e.dataset.u;else e.classList.toggle('on',e.dataset.u=='1')});cur.classList.remove('shown');sc.textContent=''}
function rst(){cur.classList.remove('shown');els().forEach(e=>{e.classList.remove('ok','bad','on');if(isS(e))e.value=''});sc.textContent=''}
document.addEventListener('change',e=>{if(e.target.tagName=='SELECT')e.target.classList.remove('ok','bad')});
document.addEventListener('keydown',e=>{if(['INPUT','SELECT'].includes(e.target.tagName))return;if(e.key=='ArrowRight')go(i+1);if(e.key=='ArrowLeft')go(i-1)});
const st=document.getElementById('st'),ex=document.getElementById('ex'),sc=document.getElementById('sc'),ct=document.getElementById('ct'),pf=document.getElementById('pf'),pv=document.getElementById('pv'),nx=document.getElementById('nx');
S=[0,1,29,2,30,4,16,5,34,7,33,31,32,36,35,17,19,28,20,22,24,25,26,27,18,23].map(k=>S[k]);
render();
